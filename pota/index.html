<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- <link
      rel="shortcut icon"
      type="image/ico"
      href="/src/assets/favicon.ico"
    /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="twitter:card" content="summary_large_image"/>
    <meta property="og:type" content="website"/>


    <title>Proportion Systems</title>
    <meta property="og:site_name"  content="Proportion Systems"/>
    <meta property="og:title"      content="Proportion Systems"/>
    <meta property="twitter:title" content="Proportion Systems"/>

    <meta name="author" content="Scott Vorthmann"/>
    <meta name="author" content="Edmund Harriss"/>
  
    <meta name="description"             content="A tool for creating proportion systems for graphic design"/>
    <meta property="og:description"      content="A tool for creating proportion systems for graphic design"/>
    <meta property="twitter:description" content="A tool for creating proportion systems for graphic design"/>

    <meta name="keywords" content="geometry,proportion,graphic,design,math"/>
    
    <meta property="og:image"  content="https://vorth.github.io/proportion-systems/preview.png"/>
    <meta name="twitter:image" content="https://vorth.github.io/proportion-systems/preview.png"/>
    
    <meta property="og:url" content="https://vorth.github.io/proportion-systems/"/>
    <link rel="canonical"      href="https://vorth.github.io/proportion-systems/">


    <style>
      * {
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        padding: 0 1rem;
        min-height: 100vh;
        max-width: 750px;
        margin: auto;
        display: flex;
        flex-direction: column;
      }

      .proportion-display {
        display: flex;
        flex-direction: column;
        margin: auto;
        padding-block: 2rem;
      }

      .nav-bar {
        border-block-end: 1px solid darkgray;
      }

      .nav-buttons button {
        padding: 6px 14px;
        border: 1px solid darkgray;
        background: white;
        border-radius: 4px;
        cursor: pointer;
      }

      .nav-buttons button.active {
        background: #333;
        color: white;
        border-color: #333;
      }

      input {
        width: 20rem;
        margin: auto;
        margin-block-end: 30px;
      }

      .equation {
        font-size: large;
        margin-block: 20px;
      }

      .diagram {
        width: min-content;
        display: block;
        margin: auto;
        padding-block: 20px;
      }

      .block {
        outline: 1px solid black;
        color: white;
        text-align: center;
      }

      .selected {
        border: 7px dashed rgb(255, 255, 255);
        z-index: 100;
      }

      .one-block {
        background-color: #aeb79e;
      }

      .x-block {
        background-color: #824346;
      }
      
      .plus-block
      .inverse-block {
        width: min-content;
        height: min-content;
        transform: rotate(0.5turn);
      }
      .plus-block {
        display: grid;
        grid-template-columns: min-content min-content;
      }

      .enumeration {
        max-height: 70dvh;
        overflow: auto;
        /* display: grid; */
        grid-template-columns: repeat(5, 1fr);
      }

      .proportion-system {
        border-block: 1px solid darkgray;
      }
    </style>
    
  </head>
  <body>
    <noscript>The app requires JavaScript to be enabled</noscript>
    <script src="/src/index.jsx" type="module"></script>

    <div id="root"></div>
  </body>
</html>
